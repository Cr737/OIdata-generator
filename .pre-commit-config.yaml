# See https://pre-commit.com for more information
# Only runs on changed files in current branch
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort - sort imports
        entry: isort
        language: system
        types: [python]
        args: [--profile, black]
        stages: [commit]

      - id: black
        name: black - code formatter
        entry: black
        language: system
        types: [python]
        args: [--line-length=88]
        stages: [commit]
